name: 打包 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 打包
        run: flutter build windows --release

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: second-salary-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
